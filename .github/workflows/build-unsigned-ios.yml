# 免费构建未签名 .ipa → AltStore 用免费 Apple ID 签名安装
# 公开仓库的 macOS 运行器免费；构建产物在 Artifacts 里下载
name: Build unsigned iOS ipa

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate iOS native project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: npx pod-install ios

      - name: Detect workspace and scheme
        id: detect
        run: |
          cd ios
          WS=$(ls -d *.xcworkspace 2>/dev/null | head -1)
          SCHEME=$(echo "${WS%.xcworkspace}")
          echo "workspace=$WS"
          echo "scheme=$SCHEME"
          echo "workspace=$WS" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build unsigned archive
        run: |
          xcodebuild \
            -workspace "ios/${{ steps.detect.outputs.workspace }}" \
            -scheme "${{ steps.detect.outputs.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/HermesDesktopLink.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Package unsigned ipa
        run: |
          APP=$(ls build/HermesDesktopLink.xcarchive/Products/Applications/)
          mkdir -p Payload
          cp -r "build/HermesDesktopLink.xcarchive/Products/Applications/$APP" Payload/
          zip -r hermes-desktop-link-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: hermes-desktop-link-unsigned-ipa
          path: hermes-desktop-link-unsigned.ipa
